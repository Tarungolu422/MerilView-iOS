workflows:
  ios-workflow:
    name: MerilView iOS IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned iOS IPA for Sideloadly
        script: |
          xcodebuild clean build \
            -project MerilView-iOS.xcodeproj \
            -scheme MerilView \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MerilView.app Payload/
          zip -r MerilView.ipa Payload
    artifacts:
      - MerilView.ipa
