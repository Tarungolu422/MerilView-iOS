name: Build MerilView iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect Xcode and Project Schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project MerilView-iOS.xcodeproj

      - name: Build Unsigned IPA for Sideloadly
        run: |
          set -o pipefail
          xcodebuild build \
            -project MerilView-iOS.xcodeproj \
            -scheme MerilView \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log || {
              echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MerilView.app Payload/
          zip -r MerilView.ipa Payload
          echo "MerilView.ipa created successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerilView-IPA
          path: MerilView.ipa
          retention-days: 14
